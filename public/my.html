<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Registrations | Campus EventHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234f46e5'/%3E%3Cpath d='M7 9h10M7 13h6' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
  <header id="site-header"></header>
  <main>
    <div class="container page-head">
      <h1>My registrations</h1>
      <p class="muted" style="margin-top:0">Events you have signed up for. You can cancel a registration any time before the event.</p>
      <div class="tabs" id="tabs">
        <button data-tab="upcoming" class="active">Upcoming <span class="count" id="c-upcoming">0</span></button>
        <button data-tab="past">Past <span class="count" id="c-past">0</span></button>
      </div>
      <div class="list" id="list"><div class="skeleton" style="height:90px"></div></div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="/js/common.js"></script>
  <script src="/js/my.js"></script>
</body>
</html>
