<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discover Events | Campus EventHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='3' fill='%238c1d2f'/%3E%3Cpath d='M8 6h8M8 12h6M8 18h8M8 5v14' stroke='white' stroke-width='2.4'/%3E%3C/svg%3E">
</head>
<body>
  <header id="site-header"></header>
  <main>
    <section class="intro">
      <div class="container">
        <h1>Events this term</h1>
        <p>Talks, workshops, fests and sports fixtures organised by college clubs and departments. Log in with your college email to reserve a seat.</p>
        <div class="facts" id="hero-stats"></div>
      </div>
    </section>

    <div class="container">
      <form class="filters" id="filters" autocomplete="off" onsubmit="return false">
        <div class="filters-row">
          <div class="field search-field">
            <label for="search">Search</label>
            <div class="search-box">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <input class="input" type="search" id="search" name="search" placeholder="Event name, venue or club">
            </div>
          </div>
          <div class="field">
            <label for="from">From date</label>
            <input class="input" type="date" id="from" name="from">
          </div>
          <div class="field">
            <label for="to">To date</label>
            <input class="input" type="date" id="to" name="to">
          </div>
          <button type="button" class="btn btn-outline" id="reset">Clear filters</button>
        </div>
        <div class="chips" id="chips">
          <button type="button" class="chip active" data-cat="">All categories</button>
          <div class="segmented" id="when">
            <button type="button" data-when="upcoming" class="active">Upcoming</button>
            <button type="button" data-when="past">Past</button>
            <button type="button" data-when="all">All</button>
          </div>
        </div>
      </form>

      <div class="section-head">
        <h2 id="results-title">Upcoming events</h2>
        <span class="muted" id="results-count"></span>
      </div>
      <div id="grid"></div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="/js/common.js"></script>
  <script src="/js/events.js"></script>
</body>
</html>
