<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | Campus EventHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='3' fill='%238c1d2f'/%3E%3Cpath d='M8 6h8M8 12h6M8 18h8M8 5v14' stroke='white' stroke-width='2.4'/%3E%3C/svg%3E">
</head>
<body>
  <header id="site-header"></header>
  <main class="auth-wrap">

      <div class="auth-card">
        <h1>Log in</h1>
        <p>Use your college email and password.</p>
        <div class="alert alert-error hidden" id="form-error"></div>
        <form id="login-form" novalidate>
          <div class="field">
            <label for="email">College email</label>
            <input class="input" type="email" id="email" name="email" placeholder="you@college.edu" autocomplete="email">
            <span class="error"></span>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input class="input" type="password" id="password" name="password" placeholder="Your password" autocomplete="current-password">
            <span class="error"></span>
          </div>
          <button class="btn btn-primary btn-block btn-lg" type="submit">Log in</button>
        </form>
        <p class="muted" style="text-align:center;margin-top:1.2rem">New here? <a href="/signup">Create an account</a></p>
        <div class="demo-box"><strong>Demo admin:</strong> <code>admin@eventhub.com</code> / <code>admin123</code></div>
      </div>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
