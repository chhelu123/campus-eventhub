<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up | Campus EventHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234f46e5'/%3E%3Cpath d='M7 9h10M7 13h6' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
  <header id="site-header"></header>
  <main class="auth-wrap">
    <aside class="auth-side">
      <h2>Join Campus EventHub in under a minute.</h2>
      <ul>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>Free for every student of the college</li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>See all the events you have registered for</li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>Passwords stored securely as bcrypt hashes</li>
      </ul>
    </aside>
    <section class="auth-main">
      <div class="auth-card">
        <h1>Create your account</h1>
        <p>Sign up with your college email to start registering for events.</p>
        <div class="alert alert-error hidden" id="form-error"></div>
        <form id="signup-form" novalidate>
          <div class="field">
            <label for="name">Full name</label>
            <input class="input" id="name" name="name" placeholder="e.g. Ananya Joshi" autocomplete="name">
            <span class="error"></span>
          </div>
          <div class="field">
            <label for="email">College email</label>
            <input class="input" type="email" id="email" name="email" placeholder="you@college.edu" autocomplete="email">
            <span class="error"></span>
          </div>
          <div class="form-grid">
            <div class="field">
              <label for="department">Department</label>
              <select class="input" id="department" name="department">
                <option value="">Select...</option>
                <option>Computer</option><option>IT</option><option>E&amp;TC</option>
                <option>Mechanical</option><option>Civil</option><option>Electrical</option>
              </select>
              <span class="error"></span>
            </div>
            <div class="field">
              <label for="year">Year</label>
              <select class="input" id="year" name="year">
                <option value="">Select...</option>
                <option>FY</option><option>SY</option><option>TY</option><option>Final Year</option>
              </select>
              <span class="error"></span>
            </div>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input class="input" type="password" id="password" name="password" placeholder="At least 6 characters" autocomplete="new-password">
            <span class="error"></span>
          </div>
          <div class="field">
            <label for="confirm">Confirm password</label>
            <input class="input" type="password" id="confirm" name="confirm" placeholder="Repeat your password" autocomplete="new-password">
            <span class="error"></span>
          </div>
          <button class="btn btn-primary btn-block btn-lg" type="submit">Create account</button>
        </form>
        <p class="muted" style="text-align:center;margin-top:1.2rem">Already registered? <a href="/login">Log in</a></p>
      </div>
    </section>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
